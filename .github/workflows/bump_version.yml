name: Bump version
on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/elixir.yml

  tag:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag_repo.outputs.created }}
      version: ${{ steps.tag_repo.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Create tag if bumped
      uses: ./.github/actions/tag_repo
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      id: tag_repo

  publish_docker:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nboisvert/ivhs_broker:latest
            nboisvert/ivhs_broker:${{ needs.tag.outputs.version }}
